[tox]
requires =
    tox-uv>=1.0
env_list =
    py312
    py313
    py314
    py314t
isolated_build = true
skip_missing_interpreters = true

[testenv]
runner = uv-venv-lock-runner
deps =
    .[dev]
commands =
    ruff format --check .
    ruff check .
    ty check --python-version 3.12 src/
    pytest {posargs}

[testenv:audit]
deps =
    .[dev]
commands =
    uv-secure

[testenv:build]
deps =
    .[dev]
commands =
    python -m build
    twine check dist/*
